behaviors:
  EnemyAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512            # Increased batch size for better training stability
      buffer_size: 4096          # Larger buffer for more training data
      learning_rate: 3.0e-4      # Standard learning rate
      beta: 5.0e-3              # Regularization to avoid overfitting
      epsilon: 0.2              # Clipping parameter for PPO
      lambd: 0.95               # Discount factor for the generalized advantage estimation
      num_epoch: 3              # Number of epochs per training
      learning_rate_schedule: linear  # Linear decay for learning rate
    network_settings:
      hidden_units: 128          # Number of neurons in each hidden layer
      num_layers: 2              # Two hidden layers for network complexity
      input_dim: 11
    max_steps: 500000            # Total number of training steps
    time_horizon: 64            # The number of steps before an agent's episode ends
    summary_freq: 10000         # Frequency of saving model and logs
    reward_signals:
      extrinsic:
        strength: 1.0            # Strength of the reward signal
        gamma: 0.99              # Discount factor for future rewards
